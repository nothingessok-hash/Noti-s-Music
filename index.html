<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noti's Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">Noti's Music
            </div>
            <nav>
                <a href="#" id="nav-home" class="active" onclick="showView('home')">Home</a>
                <a href="#" id="nav-library" onclick="showView('library')">Your Library</a>
            </nav>
                <ul id="ranking-list">
                    </ul>
        </aside>
        <main class="main-content">
            <header>
                <div class="search-container">
                    <input type="text" id="search-bar" placeholder="Search for songs or artists..." onkeyup="filterSongs()">
                </div>
            </header>
            <section class="song-section">
                <h2 id="dynamic-heading">Trending Tracks</h2>
                <div class="song-list" id="song-list">
                    <div class="song-item" onclick="handleRowClick(event, 'Born To Sin', 'Desire4u', 'https://wwwhllpfwubcnfxrgsmz.supabase.co/storage/v1/object/public/music-player/music/borntosin.mp3', 'https://wwwhllpfwubcnfxrgsmz.supabase.co/storage/v1/object/public/music-player/images/mi17.jpg')">
    <div class="track-info">
        <img src="https://wwwhllpfwubcnfxrgsmz.supabase.co/storage/v1/object/public/music-player/images/mi17.jpg" class="track-icon" alt="Album Art">
        <div>
            <p class="track-title">Born To Sin</p>
            <p class="track-artist">Desire4u</p>
        </div>
    </div>
    <div class="actions-container">
        <span class="like-btn" onclick="toggleLike(event, 'Born To Sin')">♥</span>
        <span class="play-icon">▶</span>
    </div>
</div>
                        
                    </div>
            </section>
        </main>
    </div>

    <footer class="player-bar">
        <div class="now-playing">
            <p id="player-title">No Song Selected</p>
            <p id="player-artist">-</p>
        </div>
        
        <div class="player-controls-container">
            <div class="control-buttons">
                <button class="control-btn" onclick="prevTrack()">⏮</button>
                <button class="control-btn play-main" id="main-play-btn" onclick="togglePlay()">▶</button>
                <button class="control-btn" onclick="nextTrack()">⏭</button>
            </div>
            
            <div class="timeline-container">
                <span id="current-time">0:00</span>
                <input type="range" id="seek-slider" min="0" max="100" value="0" oninput="seekSong()">
                <span id="total-duration">0:00</span>
            </div>

            <div class="audio-wrapper">
                <audio id="audio-player">
                    <source id="audio-source" src="" type="audio/mpeg">
                </audio>
            </div>
        </div>
        
        <div class="volume-placeholder"></div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
